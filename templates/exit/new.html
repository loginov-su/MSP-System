<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Заявка на выход — МШП</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4A75FF;
            --primary-2: #6C5CFF;
            --primary-light: rgba(74,117,255,0.12);
            --bg: #f2f2f6;
            --block-bg: #ffffff;
            --block-border: rgba(0,0,0,0.05);
            --widget-shadow: rgba(74,117,255,0.10);
            --text: #11181c;
            --muted: #71717a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Inter", sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            background: var(--bg);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Cover-шапка */
        .cover {
            height: 30vh;
            min-height: 200px;
            position: relative;
            border-radius: 0 0 28px 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            background: linear-gradient(135deg, #2f3d8f 0%, #4A75FF 40%, #6C5CFF 100%);
        }
        .cover::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(165deg, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.0) 60%, rgba(0,0,0,0.12) 100%);
            pointer-events: none;
        }

        .cover-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px 0;
            position: relative;
            z-index: 2;
        }
        .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; }
        .brand-logo {
            width: 32px; height: 32px; border-radius: 9px;
            background: rgba(255,255,255,0.28);
            backdrop-filter: blur(8px);
            color: #fff; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            font-size: 17px;
        }
        .brand-title { font-size: 18px; font-weight: 900; color: #fff; letter-spacing: 0.3px; }

        .back-btn {
            width: 38px; height: 38px;
            border-radius: 11px;
            border: 1px solid rgba(255,255,255,0.22);
            background: rgba(0,0,0,0.18);
            backdrop-filter: blur(8px);
            color: rgba(255,255,255,0.92);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
        }
        .back-btn:hover { background: rgba(0,0,0,0.30); }
        .back-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .cover-title {
            padding: 0 22px 64px;
            position: relative;
            z-index: 2;
        }
        .title-sub { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.8); margin-bottom: 3px; }
        .title-main { font-size: 26px; font-weight: 900; color: #fff; letter-spacing: -0.4px; line-height: 1.15; text-shadow: 0 2px 10px rgba(0,0,0,0.18); }

        /* Форма */
        .form-card {
            background: var(--block-bg);
            border: 1px solid var(--block-border);
            border-radius: 28px 28px 0 0;
            padding: 24px 18px 40px;
            margin: -44px 12px 0;
            position: relative;
            z-index: 3;
            box-shadow: 0 -6px 30px rgba(0,0,0,0.09);
        }

        .form-field { margin-bottom: 18px; }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 7px;
        }
        .form-input {
            width: 100%;
            padding: 13px 14px;
            font-family: inherit;
            font-size: 15px;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--block-border);
            border-radius: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
            background: #fff;
        }
        .form-hint { font-size: 11px; color: var(--muted); margin-top: 5px; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .submit-btn {
            width: 100%;
            margin-top: 8px;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #4A75FF 0%, #6C5CFF 100%);
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(74,117,255,0.35);
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(74,117,255,0.45); }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .result-msg {
            margin-top: 14px;
            padding: 13px 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            line-height: 1.4;
        }
        .result-msg.ok { display: block; background: #e8f7ee; color: #1a7a3a; }
        .result-msg.err { display: block; background: #fdecec; color: #c0392b; }

        /* Нижняя навигация */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-top: 1px solid rgba(0,0,0,0.07);
            display: flex;
            align-items: stretch;
            justify-content: space-around;
            padding: 0 8px env(safe-area-inset-bottom, 8px);
            z-index: 100;
            height: 56px;
        }
        .bottom-nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 3px; text-decoration: none;
            color: var(--muted); flex: 1; padding: 6px 4px;
            border-radius: 14px;
            transition: color 0.2s, background 0.2s;
            font-family: inherit;
        }
        .bottom-nav-item:hover, .bottom-nav-item.active { color: var(--primary); }
        .bottom-nav-item svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .bottom-nav-label { font-size: 10px; font-weight: 700; line-height: 1; }

        @media (min-width: 900px) {
            .bottom-nav { display: none; }
            .cover { height: 26vh; }
            .form-card { max-width: 640px; margin: -44px auto 0; border-radius: 24px; }
        }
    </style>
</head>
<body>

<div class="cover">
    <div class="cover-topbar">
        <a href="/home" class="brand">
            <span class="brand-logo">М</span>
            <span class="brand-title">МШП</span>
        </a>
        <a href="/home" class="back-btn" aria-label="Назад">
            <svg viewBox="0 0 24 24"><path d="M19 12H5"></path><polyline points="12 19 5 12 12 5"></polyline></svg>
        </a>
    </div>
    <div class="cover-title">
        <div class="title-sub">Цифровой пропуск</div>
        <div class="title-main">Заявка на выход</div>
    </div>
</div>

<div class="form-card">
    <form id="exit-form">
        <div class="form-field">
            <label class="form-label" for="fio">ФИО</label>
            <input class="form-input" id="fio" name="fio" type="text" required placeholder="Иванов Иван Иванович" autocomplete="name">
        </div>

        <div class="form-row">
            <div class="form-field">
                <label class="form-label" for="group_number">Номер группы</label>
                <input class="form-input" id="group_number" name="group_number" type="number" min="1" placeholder="5">
            </div>
            <div class="form-field">
                <label class="form-label" for="group_letter">Буква</label>
                <input class="form-input" id="group_letter" name="group_letter" type="text" maxlength="1" placeholder="А">
            </div>
        </div>

        <div class="form-field">
            <label class="form-label" for="cause">Причина выхода</label>
            <textarea class="form-input" id="cause" name="cause" rows="3" placeholder="Например: по состоянию здоровья"></textarea>
        </div>

        <div class="form-field">
            <label class="form-label" for="time">Время выхода</label>
            <input class="form-input" id="time" name="time" type="datetime-local">
            <div class="form-hint">Планируемое время выхода.</div>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn">Создать заявку</button>
        <div id="result" class="result-msg"></div>
    </form>
</div>

<nav class="bottom-nav" aria-label="Навигация">
    <a href="/home" class="bottom-nav-item" aria-label="Главная">
        <svg viewBox="0 0 24 24">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span class="bottom-nav-label">Главная</span>
    </a>
    <a href="/exit/new" class="bottom-nav-item active" aria-label="Заявки">
        <svg viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
        </svg>
        <span class="bottom-nav-label">Заявки</span>
    </a>
    <a href="#" class="bottom-nav-item" aria-label="Профиль">
        <svg viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="bottom-nav-label">Профиль</span>
    </a>
    <a href="/exit/history" class="bottom-nav-item" aria-label="История">
        <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span class="bottom-nav-label">История</span>
    </a>
</nav>

<script>
    const form = document.getElementById('exit-form');
    const result = document.getElementById('result');
    const btn = document.getElementById('submit-btn');

    function showResult(kind, text) {
        result.className = 'result-msg ' + kind;
        result.textContent = text;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        const payload = {
            fio: form.fio.value.trim(),
            group_number: form.group_number.value,
            group_letter: form.group_letter.value.trim().toUpperCase(),
            cause: form.cause.value.trim(),
            time: form.time.value,
        };
        try {
            const res = await fetch('/api/exit/my_application', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            const data = await res.json();
            if (res.ok && data.status === 'success') {
                showResult('ok', 'Заявка создана. ID: ' + data.application_id + '. Код доступа: ' + data.code);
            } else {
                showResult('err', data.message || 'Ошибка при создании заявки');
            }
        } catch (err) {
            showResult('err', 'Нет соединения с сервером');
        } finally {
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
