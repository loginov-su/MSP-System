<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Нет доступа — МШП</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4A75FF;
            --primary-2: #6C5CFF;
            --primary-light: rgba(74,117,255,0.12);
            --bg: #f2f2f6;
            --text: #11181c;
            --muted: #71717a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Inter", sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid rgba(0,0,0,0.06);
            border-radius: 28px;
            padding: 40px 28px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(74,117,255,0.10);
        }

        .icon-wrap {
            width: 76px; height: 76px;
            margin: 0 auto 20px;
            border-radius: 22px;
            background: var(--primary-light);
            color: var(--primary);
            display: flex; align-items: center; justify-content: center;
        }
        .icon-wrap svg { width: 36px; height: 36px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.3px; }

        p {
            color: var(--muted);
            font-size: 15px;
            margin-top: 10px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 26px;
            padding: 13px 28px;
            border-radius: 14px;
            background: linear-gradient(135deg, #4A75FF 0%, #6C5CFF 100%);
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(74,117,255,0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(74,117,255,0.45); }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrap">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h1>Нет доступа</h1>
        <p>Ваш аккаунт не подтверждён или у вас нет прав для просмотра этой страницы. Обратитесь к администратору.</p>
        <a class="btn" href="/home">На главную</a>
    </div>
</body>
</html>
