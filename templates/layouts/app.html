<!DOCTYPE html>
<html lang="ru" class="h-full bg-white lg:bg-zinc-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}МШП{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: 'Roboto', system-ui, sans-serif; }
        .brand-bg { background: linear-gradient(135deg, #4A75FF 0%, #6C5CFF 100%); }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="h-full">
    <div class="min-h-full">
        <!-- Мобильный верхний навбар -->
        <nav class="flex items-center gap-3 border-b border-zinc-200 bg-white px-4 py-2.5 lg:hidden">
            <a class="flex items-center gap-2.5" href="/home">
                <span class="brand-bg flex size-8 items-center justify-center rounded-lg text-sm font-semibold text-white">М</span>
                <span class="text-sm font-medium text-zinc-950">МШП</span>
            </a>
            <nav class="ml-auto flex items-center gap-1">
                {% block navbar_items %}{% endblock %}
            </nav>
        </nav>

        <!-- Сайдбар (desktop) -->
        <aside class="fixed inset-y-0 left-0 hidden w-full max-w-72 border-r border-zinc-200 bg-white px-3.5 py-4 lg:block">
            <div>
                <a class="flex items-center gap-2.5 px-2" href="/home">
                    <span class="brand-bg flex size-9 items-center justify-center rounded-lg text-base font-semibold text-white">М</span>
                    <span class="text-sm font-semibold text-zinc-950">МШП</span>
                </a>
            </div>

            <div class="mt-6 flex flex-1 flex-col">
                <div class="space-y-1">
                    {% block sidebar %}{% endblock %}
                </div>
            </div>

            <div class="absolute inset-x-0 bottom-0 border-t border-zinc-200 p-3.5">
                <div class="flex items-center gap-3 rounded-lg px-2 py-1.5">
                    <span class="flex size-9 shrink-0 items-center justify-center rounded-lg bg-zinc-200 text-sm font-medium text-zinc-700">У</span>
                    <span class="min-w-0 grow">
                        <span class="block truncate text-sm font-medium text-zinc-950">Ученик</span>
                        <span class="block truncate text-xs font-normal text-zinc-500">{{ current_user_email|default('user@msp.ru') }}</span>
                    </span>
                </div>
            </div>
        </aside>

        <!-- Основная область -->
        <main class="lg:pl-72">
            <div class="mx-auto max-w-6xl px-4 py-10 sm:px-6 lg:px-10">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
