# nginx.conf — продакшн-конфигурация для портала МШП
# Запуск gunicorn: gunicorn -c gunicorn.conf.py main:app
#
# SSL: домен и сертификаты появятся позже. Сейчас секция 443 закомментирована.
# После выдачи сертификатов:
#   1. заменяем _domain_ и пути к .pem/.key в секции 443
#   2. раскомментируем блок server { listen 443 ssl ... }
#   3. включаем редирект http -> https в блоке 80.

# Оптимизация: события epoll, больше воркеров, keepalive
worker_processes auto;
worker_rlimit_nofile 65535;
events {
    worker_connections 2048;
    multi_accept on;
}

http {
    server_tokens off;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Logging ---
    access_log  /var/log/nginx/msp_access.log;
    error_log   /var/log/nginx/msp_error.log warn;

    # --- Базовые оптимизации ---
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 16m;

    # --- Сжатие ---
    gzip                on;
    gzip_vary           on;
    gzip_min_length     1024;
    gzip_comp_level     5;
    gzip_proxied       any;
    gzip_types          text/plain text/css application/json application/javascript
                        application/xml image/svg+xml text/javascript;

    # --- Безопасность ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    # -----------------------------------------------------------
    # HTTP -> HTTPS redirect (активируется после получения сертификата)
    # Раскомментируйте, когда секция 443 будет готова.
    # -----------------------------------------------------------
    #server {
    #    listen 80;
    #    server_name _domain_;
    #    return 301 https://$host$request_uri;
    #}

    # -----------------------------------------------------------
    # Основной сервер. Пока только HTTP; затем перенесите блок в 443.
    # -----------------------------------------------------------
    server {
        listen      80;
        listen      [::]:80;
        server_name _domain_;

        # --- Статика: отдельно от приложения, с кэшем ---
        location /static/ {
            alias       /var/www/msp/static/;
            expires     7d;
            add_header Cache-Control "public, immutable";
            access_log  off;
        }

        # --- SSL: раскомментировать после получения сертификатов ---
        # listen 443 ssl http2;
        # ssl_certificate     /etc/letsencrypt/live/_domain_/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/_domain_/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers HIGH:!aNULL:!MD5;
        # ssl_session_cache shared:SSL:10m;
        # ssl_session_timeout 10m;

        location / {
            proxy_pass          http://msp_backend;
            proxy_http_version  1.1;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_set_header    Connection        "";
            proxy_connect_timeout  60s;
            proxy_read_timeout    60s;
        }
    }

    # Apache/Gunicorn бэкенд
    upstream msp_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }
}